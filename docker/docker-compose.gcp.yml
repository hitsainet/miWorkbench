# miWorkbench - GCP Docker Compose Deployment
# URL: miworkbench.hitsai.net
#
# Prerequisites:
# 1. Docker with NVIDIA Container Toolkit installed
# 2. NVIDIA T4 GPU available
# 3. DNS pointing miworkbench.hitsai.net to this instance
#
# Usage:
#   docker compose -f docker-compose.gcp.yml up -d
#
# To pull latest images:
#   docker compose -f docker-compose.gcp.yml pull
#   docker compose -f docker-compose.gcp.yml up -d

services:
  # =========================================
  # MIWORKBENCH POSTGRES
  # =========================================
  postgres:
    image: postgres:15
    container_name: miworkbench-postgres
    environment:
      POSTGRES_DB: mistudio
      POSTGRES_USER: mistudio
      POSTGRES_PASSWORD: ${MIWORKBENCH_POSTGRES_PASSWORD:-${MISTUDIO_POSTGRES_PASSWORD:?MIWORKBENCH_POSTGRES_PASSWORD (or the old MISTUDIO_POSTGRES_PASSWORD) must be set}}  # p9: keep, frozen database or role name (DR-19)
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mistudio_postgres_data:/var/lib/postgresql/data  # p9: keep, frozen volume name (DR-41))
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mistudio -d mistudio"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # NEURONPEDIA POSTGRES (separate database with pgvector)
  # =========================================
  neuronpedia-postgres:
    image: pgvector/pgvector:pg15
    container_name: neuronpedia-postgres
    environment:
      POSTGRES_DB: neuronpedia
      POSTGRES_USER: neuronpedia
      POSTGRES_PASSWORD: ${NEURONPEDIA_POSTGRES_PASSWORD:?NEURONPEDIA_POSTGRES_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - neuronpedia_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuronpedia -d neuronpedia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # REDIS (Celery broker)
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: miworkbench-redis
    volumes:
      - mistudio_redis_data:/data  # p9: keep, frozen volume name (DR-41)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # MIWORKBENCH BACKEND (API + Celery Worker + Beat)
  # =========================================
  backend:
    image: hitsai/miworkbench-backend:latest
    container_name: miworkbench-backend
    environment:
      SERVICE_TYPE: api
      DATABASE_URL: postgresql+asyncpg://mistudio:${MIWORKBENCH_POSTGRES_PASSWORD:-${MISTUDIO_POSTGRES_PASSWORD:?MIWORKBENCH_POSTGRES_PASSWORD (or the old MISTUDIO_POSTGRES_PASSWORD) must be set}}@postgres:5432/mistudio  # p9: keep, frozen database or role name (DR-19)
      DATABASE_URL_SYNC: postgresql+psycopg2://mistudio:${MIWORKBENCH_POSTGRES_PASSWORD:-${MISTUDIO_POSTGRES_PASSWORD:?MIWORKBENCH_POSTGRES_PASSWORD (or the old MISTUDIO_POSTGRES_PASSWORD) must be set}}@postgres:5432/mistudio  # p9: keep, frozen database or role name (DR-19)
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: '${MIWORKBENCH_SECRET_KEY:-${MISTUDIO_SECRET_KEY:?MIWORKBENCH_SECRET_KEY (or the old MISTUDIO_SECRET_KEY) must be set (generate: python -c "import secrets; print(secrets.token_hex(32))")}}'  # p9: keep, old operator name read for one release (P9-D7)
      DATA_DIR: /data
      BACKEND_DIR: /app
      INTERNAL_API_URL: http://backend:8000
      # Neuronpedia local instance configuration
      NEURONPEDIA_LOCAL_DB_URL: postgresql://neuronpedia:${NEURONPEDIA_POSTGRES_PASSWORD:?NEURONPEDIA_POSTGRES_PASSWORD must be set}@neuronpedia-postgres:5432/neuronpedia
      NEURONPEDIA_LOCAL_URL: http://neuron.hitsai.net
      # Ollama configuration
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - mistudio_data:/data  # p9: keep, frozen volume name (DR-41)
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # CELERY WORKER (background tasks)
  # =========================================
  celery-worker:
    image: hitsai/miworkbench-backend:latest
    container_name: miworkbench-celery-worker
    environment:
      SERVICE_TYPE: celery-worker
      DATABASE_URL: postgresql+asyncpg://mistudio:${MIWORKBENCH_POSTGRES_PASSWORD:-${MISTUDIO_POSTGRES_PASSWORD:?MIWORKBENCH_POSTGRES_PASSWORD (or the old MISTUDIO_POSTGRES_PASSWORD) must be set}}@postgres:5432/mistudio  # p9: keep, frozen database or role name (DR-19)
      DATABASE_URL_SYNC: postgresql+psycopg2://mistudio:${MIWORKBENCH_POSTGRES_PASSWORD:-${MISTUDIO_POSTGRES_PASSWORD:?MIWORKBENCH_POSTGRES_PASSWORD (or the old MISTUDIO_POSTGRES_PASSWORD) must be set}}@postgres:5432/mistudio  # p9: keep, frozen database or role name (DR-19)
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: '${MIWORKBENCH_SECRET_KEY:-${MISTUDIO_SECRET_KEY:?MIWORKBENCH_SECRET_KEY (or the old MISTUDIO_SECRET_KEY) must be set (generate: python -c "import secrets; print(secrets.token_hex(32))")}}'  # p9: keep, old operator name read for one release (P9-D7)
      DATA_DIR: /data
      BACKEND_DIR: /app
      INTERNAL_API_URL: http://backend:8000
      NEURONPEDIA_LOCAL_DB_URL: postgresql://neuronpedia:${NEURONPEDIA_POSTGRES_PASSWORD:?NEURONPEDIA_POSTGRES_PASSWORD must be set}@neuronpedia-postgres:5432/neuronpedia
      NEURONPEDIA_LOCAL_URL: http://neuron.hitsai.net
      # Ollama configuration
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - mistudio_data:/data  # p9: keep, frozen volume name (DR-41)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # CELERY BEAT (scheduled tasks)
  # =========================================
  celery-beat:
    image: hitsai/miworkbench-backend:latest
    container_name: miworkbench-celery-beat
    environment:
      SERVICE_TYPE: celery-beat
      DATABASE_URL: postgresql+asyncpg://mistudio:${MIWORKBENCH_POSTGRES_PASSWORD:-${MISTUDIO_POSTGRES_PASSWORD:?MIWORKBENCH_POSTGRES_PASSWORD (or the old MISTUDIO_POSTGRES_PASSWORD) must be set}}@postgres:5432/mistudio  # p9: keep, frozen database or role name (DR-19)
      DATABASE_URL_SYNC: postgresql+psycopg2://mistudio:${MIWORKBENCH_POSTGRES_PASSWORD:-${MISTUDIO_POSTGRES_PASSWORD:?MIWORKBENCH_POSTGRES_PASSWORD (or the old MISTUDIO_POSTGRES_PASSWORD) must be set}}@postgres:5432/mistudio  # p9: keep, frozen database or role name (DR-19)
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: '${MIWORKBENCH_SECRET_KEY:-${MISTUDIO_SECRET_KEY:?MIWORKBENCH_SECRET_KEY (or the old MISTUDIO_SECRET_KEY) must be set (generate: python -c "import secrets; print(secrets.token_hex(32))")}}'  # p9: keep, old operator name read for one release (P9-D7)
      DATA_DIR: /data
      BACKEND_DIR: /app
      INTERNAL_API_URL: http://backend:8000
    volumes:
      - mistudio_data:/data  # p9: keep, frozen volume name (DR-41)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # MIWORKBENCH FRONTEND
  # =========================================
  frontend:
    image: hitsai/miworkbench-frontend:latest
    container_name: miworkbench-frontend
    ports:
      # Container listens on 8080 (non-root nginx-unprivileged image).
      - "3000:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # NEURONPEDIA WEBAPP
  # =========================================
  neuronpedia-webapp:
    image: hitsai/neuronpedia-webapp:latest
    container_name: neuronpedia-webapp
    environment:
      DATABASE_URL: postgresql://neuronpedia:${NEURONPEDIA_POSTGRES_PASSWORD:?NEURONPEDIA_POSTGRES_PASSWORD must be set}@neuronpedia-postgres:5432/neuronpedia
      POSTGRES_PRISMA_URL: postgresql://neuronpedia:${NEURONPEDIA_POSTGRES_PASSWORD:?NEURONPEDIA_POSTGRES_PASSWORD must be set}@neuronpedia-postgres:5432/neuronpedia
      POSTGRES_URL_NON_POOLING: postgresql://neuronpedia:${NEURONPEDIA_POSTGRES_PASSWORD:?NEURONPEDIA_POSTGRES_PASSWORD must be set}@neuronpedia-postgres:5432/neuronpedia
      NEXTAUTH_URL: http://neuron.hitsai.net
      NEXTAUTH_SECRET: ${NEURONPEDIA_NEXTAUTH_SECRET:?NEURONPEDIA_NEXTAUTH_SECRET must be set}
      NODE_ENV: production
      IS_LOCALHOST: "true"
      SKIP_ENV_VALIDATION: "true"
      DEMO_MODE: "false"
      NEXT_PUBLIC_DEMO_MODE: "false"
    depends_on:
      neuronpedia-postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # OLLAMA (Local LLM inference)
  # =========================================
  ollama:
    image: ollama/ollama:latest
    container_name: miworkbench-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - miworkbench-net

  # =========================================
  # NGINX REVERSE PROXY
  # =========================================
  nginx:
    image: nginx:alpine
    container_name: miworkbench-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.gcp.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
      - neuronpedia-webapp
    restart: unless-stopped
    networks:
      - miworkbench-net

volumes:
  mistudio_postgres_data:  # p9: keep, frozen volume name (DR-41))
  neuronpedia_postgres_data:
  mistudio_redis_data:  # p9: keep, frozen volume name (DR-41)
  mistudio_data:  # p9: keep, frozen volume name (DR-41)
  ollama_data:

networks:
  miworkbench-net:
    driver: bridge
